default: true

# Renderers wrap prose, while technical tables, URLs, and commands often cannot
# be wrapped without reducing readability or changing meaning.
MD013: false

# GitHub admonitions and activity-log entries intentionally use adjacent
# blockquotes separated by blank lines.
MD028: false

# Bold lead-ins are used as compact labels throughout API and design documents.
MD036: false

# Permit duplicate headings at different levels/siblings only
MD024:
  siblings_only: true

# Heading punctuation rules (common sentence punctuation)
MD026:
  punctuation: ".,;:!"

# Allow first line not to be a top-level heading (some docs start with metadata)
MD041: false

# Code block style
MD046:
  style: fenced

# Inline code spans: allow backticks in text without strict checks
MD038: false

# Ordered list item prefix flexible (allow any numbering)
MD029: false

# Allow inline HTML (used in some docs)
MD033: false
